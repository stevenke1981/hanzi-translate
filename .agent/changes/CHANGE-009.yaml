id: CHANGE-009
title: 自動偵測中文腳本並選擇繁體或英文輸出
classification: Feature
risk: MEDIUM
intent:
  goal: 讓使用者貼上文字後，不必先選來源腳本即可處理簡體中文
  user_outcome: 自動辨識輸入，簡體中文可直接轉為繁體中文或翻譯成英文
in_scope:
  - 自動辨識簡體中文、繁體中文、英文與無法辨識內容
  - 簡體中文轉繁體中文維持本機執行且不限次數
  - 自動模式支援繁體中文或英文輸出
  - 中英文介面與核心測試
out_of_scope:
  - 自動辨識 Base64、URL、HTML 或其他位元組編碼
  - 修改既有手動簡繁、編碼與翻譯模式的選項行為
  - 自動部署與公開發布
protected_behavior:
  - 簡繁與編碼轉換維持本機、不限次數
  - 使用者 API Key 只留在裝置端
  - 既有 /api/translate、法律與 SEO 路由不變
acceptance:
  - 簡體中文輸入在自動模式可轉為繁體中文
  - 簡體中文輸入選英文時使用現有翻譯服務與額度流程
  - 既有手動模式與核心回歸測試通過
