baseline:
  id: BASELINE-20260730-001
  accepted_features:
    - 簡體 台灣繁體 台灣詞彙 香港繁體互換
    - Base64 URL HTML Unicode UTF-8 Hex 雙向轉換
    - 免費與自備金鑰中英翻譯設定
    - 裝置 API 設定清除
    - 隱私同意 法律 SEO 與廣告路由
  critical_user_flows:
    - 台灣詞彙輸入轉為正確簡體地區詞彙
    - 編碼後切換解碼並還原原文
    - 儲存後清除裝置 API 設定
    - 桌面與 390px 行動版操作
  protected_behavior:
    - 簡繁與編碼維持本機不限次數
    - API Key 不寫入伺服器資料庫
    - 切換工具時保留使用者輸入
    - 既有 Sites project_id 不變
  public_interfaces:
    - /
    - /api/translate
    - /privacy
    - /terms
    - /robots.txt
    - /sitemap.xml
    - /ads.txt
  data_compatibility:
    - yijiang-ad-consent localStorage key
    - yijiang-api-settings localStorage key
  environment:
    - Windows PowerShell
    - Node.js 22.13+
    - Vinext Vite Sites
  known_limitations:
    - OpenCC 大型詞庫仍為按需下載資源 首屏不再載入
    - 免費翻譯依外部服務可用性
    - Sites 維持擁有者限定存取 未登入只能驗證登入閘道
    - Cloudflare Worker 的免費翻譯上游可能受出口網路限制 自備 API Key 可避開
  evidence:
    - npm audit --omit=dev --audit-level=high found 0 vulnerabilities
    - npm run lint PASS
    - npm run build PASS
    - npm test 14 of 14 PASS
    - agent-browser desktop and 390px mobile acceptance PASS
    - local Web Vitals CLS 0 FCP 100ms TTFB 56ms
    - GitHub public main push PASS
    - Sites version 4 deployment succeeded
    - Cloudflare Worker deployment succeeded version 2c36da52-4538-4fc2-81cc-02c0b34c4c35
    - Cloudflare SEO verification passed: canonical, page-specific OpenGraph URL, WebSite JSON-LD, robots sitemap, stable sitemap lastmod, and no legacy Sites domain
    - Cloudflare Worker deployment succeeded version dc667210-d983-49df-915f-060a49cf5795
    - English interface browser acceptance passed: language toggle, persisted local preference, 390px no overflow, script conversion, English privacy page and lang=en
    - Cloudflare Worker deployment succeeded version a2cedccf-6d21-4535-9843-b8d2e89d7b05
    - Cloudflare public routes / /privacy /terms /robots.txt /sitemap.xml /ads.txt /api/translate returned 200
    - Cloudflare builtin translation POST returned 502 because both free upstreams rejected Worker egress
  status: passed
